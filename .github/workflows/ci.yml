name: CI/CD Pipeline -> GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on a branch are pointless, but never cancel a deploy
# that is already publishing to Pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22.x"
  # The origin(s) the editor is served from, so the /preview entry accepts
  # content posted from it. Read from a repository variable, comma-separated
  # for more than one; empty when unset, which leaves only the localhost
  # origins the preview allows by default. See src/preview/protocol.ts.
  VITE_PREVIEW_EDITOR_ORIGIN: ${{ vars.VITE_PREVIEW_EDITOR_ORIGIN }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Whole history, not the default single commit: the build dates the
      # sitemap, the footer and the printed CV from the last commit that
      # touched src/content (scripts/contentDate.ts), and a shallow clone can
      # only answer that when HEAD itself changed the content. Anything
      # older would fall back to the build date — right by accident on a
      # content deploy, wrong on every other.
      # Every action is pinned to a commit, not a tag: a tag is a name its
      # owner — or whoever takes over the account — can move, and a commit
      # is not. The version rides in the comment for the reader, and
      # Dependabot (.github/dependabot.yml) moves both together.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # No --legacy-peer-deps. That flag is what let a package refusing the
      # installed Storybook core sit here unnoticed: it told npm to install
      # the tree anyway, so the one place that would have reported the
      # conflict was told not to.
      - name: Install dependencies
        run: npm ci

      # The Storybook test-runner only ever launches Chromium.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Quality gate
        run: npm run check:quality

      # After the gate, which is what builds dist/. Its own step rather than
      # part of check:quality: it needs a browser and about a minute, and a
      # unit-test loop that slow stops being run locally.
      - name: Lighthouse
        run: npm run check:lighthouse

      # The CV is the one artifact nobody sees on a screen. It ran to six
      # sheets with a third of the first and half the fourth left blank
      # before anything looked at it.
      - name: Printed CV
        run: npm run check:print

      # Whether the page honours prefers-reduced-motion is only visible in a
      # browser: motion reads the preference through matchMedia at load, and
      # under jsdom both settings animate identically.
      - name: Reduced motion
        run: npm run check:motion

      # Whether a control shows keyboard focus is only visible in a browser
      # too, and only in pixels: a computed style reports a colour Chrome
      # does not paint, and a control mid-transition reports a ring it is
      # still fading in.
      - name: Focus indicator
        run: npm run check:focus

      # How big the things you tap are is geometry after layout at a real
      # width, so it needs a browser for the same reason the two above do.
      # Nothing measured it, and eight icon links were 28x28 while the
      # control that opens the navigation on a phone was 32x32.
      - name: Target size
        run: npm run check:targets

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Only this job publishes, so only this job gets the tokens for it.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
